<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pulseTitle pulseDesc">
  <title id="pulseTitle">Pulse project preview</title>
  <desc id="pulseDesc">Abstract analytics dashboard illustration in purple and blue gradients.</desc>
  <defs>
    <linearGradient id="gradPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C63FF" />
      <stop offset="100%" stop-color="#2E2A78" />
    </linearGradient>
    <filter id="shadowPulse" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect width="1200" height="800" rx="36" fill="url(#gradPulse)" filter="url(#shadowPulse)" />
  <rect x="120" y="140" width="960" height="500" rx="28" fill="rgba(255,255,255,0.14)" />
  <rect x="180" y="210" width="380" height="100" rx="18" fill="rgba(255,255,255,0.95)" />
  <rect x="180" y="340" width="520" height="130" rx="18" fill="rgba(255,255,255,0.65)" />
  <rect x="180" y="520" width="760" height="110" rx="18" fill="rgba(255,255,255,0.24)" />
  <circle cx="830" cy="300" r="68" fill="rgba(255,255,255,0.7)" />
  <circle cx="930" cy="430" r="52" fill="rgba(255,255,255,0.85)" />
  <text x="180" y="120" font-family="'Inter', sans-serif" font-size="64" font-weight="700" fill="#FFFFFF">Pulse</text>
  <text x="180" y="195" font-family="'Inter', sans-serif" font-size="24" fill="#0A0A0C">Realtime analytics dashboard</text>
</svg>